[project]
name = "student-dropout-prediction"
version = "0.1.0"
description = "Stage-wise student dropout prediction on UCI dataset 697: nested-CV models, SHAP, fairness audit and visual analytics"
readme = "README.md"
# The committed results were produced with Python 3.10 and these exact versions
# (the same pins as requirements.txt). uv.lock pins every transitive dependency too.
requires-python = "==3.10.*"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "xgboost==3.2.0",
    "matplotlib==3.10.9",
    "joblib==1.6.0",
    "shap==0.49.1",
    "umap-learn==0.5.12",
]

[tool.uv]
# The code runs as `python -m src.<module>` from the repository root; nothing to build.
package = false
